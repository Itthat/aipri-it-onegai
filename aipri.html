<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아이프리 대행 | 버스</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="or-photos.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav aria-label="주요 메뉴">
      <a href="aipri.html" class="active">아이프리버스</a>
      <a href="onegai.html">오네가이 아이프리</a>
      <a href="friendcard.html">프렌드카드</a>
    </nav>
  </header>

  <main class="content-wrap">
    <section class="panel">
      <div class="section-title">
        <h2>파츠 · 코디 · 악곡 사진</h2>
        <span class="tag">미리 등록하는 사진</span>
      </div>

      <p class="muted">참고할 사진을 종류별로 모아두는 공간입니다.</p>

      <div class="empty-gallery">
        <div class="placeholder-tile">
          <span>＋</span>
          <b>파츠 사진</b>
        </div>
        <div class="placeholder-tile">
          <span>＋</span>
          <b>코디 사진</b>
        </div>
        <div class="placeholder-tile">
          <span>＋</span>
          <b>악곡 사진</b>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>OR 사진</h2>
        <span class="tag tag-blue">작업자 직접 추가</span>
      </div>

      <p class="muted">추가한 사진은 현재 브라우저에 저장됩니다. 다른 브라우저나 기기와 자동으로 공유되지는 않습니다.</p>

      <div class="upload-row">
        <label class="upload-button" for="orUpload">＋ 사진 추가</label>
        <input id="orUpload" type="file" accept="image/*" multiple hidden>
        <button id="clearAll" class="button button-danger" type="button">전체 지우기</button>
      </div>

      <p id="status" class="status" aria-live="polite">저장된 사진을 불러오는 중입니다…</p>
      <div id="orGallery" class="photo-gallery" aria-live="polite"></div>

      <div id="emptyState" class="empty-state" hidden>
        <span>▧</span>
        <b>아직 추가한 OR 사진이 없습니다.</b>
